name: Weekly AniList gap-fill

# Upserts missing newest anime into the Supabase search index (bounded top-up).
# Full catalog refresh from anime-offline-database is manual: npm run sync
# Run on a schedule and via the Actions tab (Run workflow).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  gap-fill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22+ has a global WebSocket, which @supabase/supabase-js needs.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: AniList gap-fill (newest anime missing from index)
        run: npm run sync:gaps:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
