name: Weekly catalog sync

# Refreshes the Supabase search index from the anime-offline-database release.
# Runs on a schedule and can be triggered manually from the Actions tab.
on:
  schedule:
    # Every Monday at 06:00 UTC (the dataset publishes weekly).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22+ has a global WebSocket, which @supabase/supabase-js needs.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync catalog into Supabase
        run: npm run sync:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: AniList gap-fill (newest anime missing from index)
        run: npm run sync:gaps:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
